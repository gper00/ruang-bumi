- id: angin-laut
  istilah: Angin laut
  definisi: Angin yang bertiup dari laut ke darat pada siang hari karena daratan lebih cepat panas daripada laut.
  sumber: noaa-sea-breeze
- id: angin-darat
  istilah: Angin darat
  definisi: Angin yang bertiup dari darat ke laut pada malam hari karena laut menyimpan panas lebih lama daripada daratan.
  sumber: noaa-sea-breeze
- id: kalor-jenis
  istilah: Kalor jenis
  definisi: Banyaknya energi panas yang dibutuhkan untuk menaikkan suhu satu kilogram zat sebesar satu derajat Celsius. Air punya kalor jenis tinggi, sekitar 4.180 J/(kg·°C).
  sumber: noaa-sea-breeze
- id: lempeng-tektonik
  istilah: Lempeng tektonik
  definisi: Potongan besar litosfer Bumi yang bergerak di atas lapisan mantel yang lebih lentur.
  sumber: usgs-plate-tectonics
- id: zona-subduksi
  istilah: Zona subduksi
  definisi: Tempat satu lempeng menunjam ke bawah lempeng lain, biasanya di dasar samudra. Di sini gempa kuat dan gunung api sering muncul.
  sumber: usgs-plate-tectonics
- id: cincin-api
  istilah: Cincin Api
  definisi: Sabuk gunung api dan zona gempa yang mengelilingi Samudra Pasifik, melewati Indonesia, Filipina, Jepang, dan Amerika.
  sumber: usgs-plate-tectonics
- id: musim
  istilah: Musim
  definisi: Bagian tahun dengan pola cuaca yang khas. Di Indonesia, musim hujan dan kemarau bergantung pada arah angin muson.
  sumber: bmkg-musim
- id: angin-muson
  istilah: Angin muson
  definisi: Angin yang berganti arah dua kali setahun karena perbedaan pemanasan antara benua Asia dan Australia.
  sumber: bmkg-musim
- id: siklus-air
  istilah: Siklus air
  definisi: Perjalanan air dari laut ke atmosfer, ke daratan, lalu kembali lagi ke laut lewat hujan dan aliran sungai.
  sumber: usgs-water-cycle
- id: penguapan
  istilah: Penguapan
  definisi: Perubahan air menjadi uap air setelah menyerap panas, misalnya dari sinar matahari.
  sumber: usgs-water-cycle
- id: kondensasi
  istilah: Kondensasi
  definisi: Perubahan uap air menjadi titik-titik air atau kristal es ketika udara mendingin.
  sumber: usgs-water-cycle
- id: akuifer
  istilah: Akuifer
  definisi: Lapisan batuan atau tanah yang mampu menyimpan dan mengalirkan air tanah dalam jumlah besar.
  sumber: usgs-water-cycle
- id: bioma
  istilah: Bioma
  definisi: Wilayah luas dengan iklim dan jenis tumbuhan serta hewan yang khas, misalnya hutan hujan tropis atau gurun.
  sumber: nasa-biomes
- id: hutan-hujan-tropis
  istilah: Hutan hujan tropis
  definisi: Bioma panas dan basah sepanjang tahun dengan kanopi rapat dan keanekaragaman hayati sangat tinggi.
  sumber: nasa-biomes
- id: stepa
  istilah: Stepa
  definisi: Padang rumput di lintang sedang. Hujannya cukup untuk pohon, tetapi api dan penggembalaan yang berulang menahan pohon di tingkat muda.
  sumber: nasa-grassland
- id: hutan-gugur
  istilah: Hutan gugur
  definisi: Hutan beriklim sedang dengan empat musim jelas; pohonnya melepas seluruh daun sebelum musim dingin.
  sumber: nasa-temperate-forest
- id: taiga
  istilah: Taiga
  definisi: Hutan boreal berdaun jarum di lintang tinggi, bioma darat terluas di dunia.
  sumber: nasa-coniferous
- id: tundra
  istilah: Tundra
  definisi: Bioma paling dingin, tanpa pohon tinggi, tumbuh di atas tanah yang tetap beku sepanjang tahun.
  sumber: nasa-tundra
- id: permafrost
  istilah: Permafrost
  definisi: Tanah atau batuan yang tetap beku sepanjang tahun. Di atasnya hanya ada lapisan tipis yang mencair pada musim panas.
  sumber: noaa-permafrost
- id: lapisan-aktif
  istilah: Lapisan aktif
  definisi: Lapisan teratas tanah di daerah permafrost yang mencair pada musim panas. Tebalnya umumnya 30–100 cm.
  sumber: noaa-permafrost
- id: dormansi
  istilah: Dormansi
  definisi: Keadaan berhenti tumbuh untuk sementara, misalnya pohon gugur yang beristirahat sepanjang musim dingin.
  sumber: nps-deciduous-forest
- id: troposfer
  istilah: Troposfer
  definisi: Lapisan atmosfer paling bawah, dari permukaan sampai sekitar 8–14,5 km. Di sini hampir semua uap air dan cuaca berada, dan suhunya turun sekitar 6,5 °C setiap kilometer.
  sumber: nasa-atmosphere-cake
- id: tropopause
  istilah: Tropopause
  definisi: Batas antara troposfer dan stratosfer, tempat suhu berhenti turun. Letaknya sekitar 8 km di daerah kutub sampai 17 km di ekuator.
  sumber: noaa-atmosphere-layers
- id: stratosfer
  istilah: Stratosfer
  definisi: Lapisan atmosfer di atas troposfer, sampai sekitar 50 km. Ozon di lapisan ini menyerap ultraviolet sehingga suhunya makin hangat ke atas.
  sumber: nasa-what-atmosphere
- id: lapisan-ozon
  istilah: Lapisan ozon
  definisi: Bagian stratosfer yang banyak mengandung ozon dan menyerap sebagian besar radiasi ultraviolet Matahari.
  sumber: nasa-what-atmosphere
- id: mesosfer
  istilah: Mesosfer
  definisi: Lapisan atmosfer antara sekitar 50 dan 85 km. Suhunya turun lagi sampai mesopause, bagian terdingin atmosfer, dan meteor terbakar di sini.
  sumber: nasa-atmosphere-cake
- id: termosfer
  istilah: Termosfer
  definisi: Lapisan atmosfer di atas mesosfer. Gas di sini menyerap ultraviolet ekstrem dan sinar-X, sehingga suhunya bisa mencapai 2.000 °C meski jumlah molekulnya sangat sedikit.
  sumber: nasa-what-atmosphere
- id: sesar
  istilah: Sesar
  definisi: Bidang rekahan di kerak Bumi tempat dua blok batuan bergerak relatif satu terhadap yang lain. Gempa terjadi saat gerakan itu berlangsung mendadak.
  sumber: usgs-science-earthquakes
- id: hiposentrum
  istilah: Hiposentrum
  definisi: Titik di bawah permukaan Bumi tempat gempa mulai; sering disebut fokus. Kedalamannya menentukan kelas gempa — dangkal, menengah, atau dalam.
  sumber: usgs-science-earthquakes
- id: episentrum
  istilah: Episentrum
  definisi: Titik di permukaan Bumi yang tepat berada di atas hiposentrum.
  sumber: usgs-science-earthquakes
- id: pemulihan-elastis
  istilah: Pemulihan elastis
  definisi: Proses saat batuan menyimpan tegangan secara bertahap sambil melengkung, lalu melepasnya mendadak ketika sesar meluncur. Teori ini disusun setelah gempa San Francisco 1906.
  sumber: usgs-elastic-rebound
- id: gempa-susulan
  istilah: Gempa susulan
  definisi: Gempa yang lebih kecil setelah gempa utama di tempat yang sama; bisa berlanjut berminggu-minggu sampai bertahun-tahun.
  sumber: usgs-science-earthquakes
- id: magnitudo
  istilah: Magnitudo
  definisi: Ukuran besar satu gempa yang dihitung dari rekaman seismograf. Berbeda dengan intensitas, yang berbeda-beda menurut lokasi pengamat.
  sumber: usgs-science-earthquakes
- id: iklim
  istilah: Iklim
  definisi: Rata-rata dan pola cuaca suatu tempat dalam jangka panjang, biasanya dihitung puluhan tahun.
  sumber: bmkg-musim
- id: litosfer
  istilah: Litosfer
  definisi: Lapisan luar Bumi yang kaku, terdiri dari kerak dan bagian atas mantel, terpecah menjadi lempeng-lempeng.
  sumber: usgs-plate-tectonics

- id: danau
  istilah: Danau
  definisi: Perairan yang luas dan tenang, biasanya diambil dari hujan atau air tanah.
  sumber: noaa-water-cycle

- id: sungai
  istilah: Sungai
  definisi: Aliran air yang membawa muatan dari daratan menuju laut atau danau.
  sumber: noaa-water-cycle

- id: permukaan
  istilah: Permukaan
  definisi: Bagian air yang berada di lapisan paling atas dan langsung terkena cahaya Matahari serta angin.
  sumber: noaa-water-cycle

- id: pantai
  istilah: Pantai
  definisi: Wilayah pertemuan antara air dan darat yang terus berubah karena gelombang, pasang surut, dan arus.
  sumber: noaa-sea-breeze

- id: zona-fotik
  istilah: Zona fotik
  definisi: Lapisan permukaan laut sampai sekitar 200 meter yang masih cukup terang untuk fotosintesis.
  sumber: noaa-layers-ocean
- id: zona-senja
  istilah: Zona senja
  definisi: Lapisan laut sekitar 200–1.000 meter; cahaya sangat redup sehingga fotosintesis tidak berlangsung.
  sumber: noaa-layers-ocean
- id: zona-gelap
  istilah: Zona gelap
  definisi: Lapisan laut di bawah 1.000 meter yang tidak menerima cahaya Matahari.
  sumber: noaa-layers-ocean
- id: arus-laut
  istilah: Arus laut
  definisi: Pergerakan air laut yang terus-menerus; di permukaan digerakkan angin, di kedalaman oleh perbedaan suhu dan kadar garam.
  sumber: noaa-ocean-currents
- id: efek-coriolis
  istilah: Efek Coriolis
  definisi: Pembelokan arah gerak air dan udara karena Bumi berputar.
  sumber: noaa-ocean-currents
- id: upwelling
  istilah: Upwelling
  definisi: Naiknya air dingin dari kedalaman ke permukaan, membawa nutrisi.
  sumber: noaa-upwelling
- id: daerah-aliran-sungai
  istilah: Daerah aliran sungai
  definisi: Seluruh daratan yang mengalirkan air hujan dan air tanah ke satu titik keluaran.
  sumber: usgs-watersheds
- id: sedimen
  istilah: Sedimen
  definisi: Partikel tanah atau batuan yang terangkat dan terbawa air.
  sumber: usgs-sediment
- id: muara
  istilah: Muara
  definisi: Tempat sungai bertemu laut dan air tawar bercampur dengan air laut.
  sumber: usgs-watersheds
- id: epilimnion
  istilah: Epilimnion
  definisi: Lapisan atas danau yang lebih hangat dan bercampur oleh angin.
  sumber: usgs-lakes-stratification
- id: termoklin
  istilah: Termoklin
  definisi: Lapisan peralihan di danau tempat suhu turun cepat terhadap kedalaman.
  sumber: usgs-lakes-stratification
- id: hipolimnion
  istilah: Hipolimnion
  definisi: Lapisan bawah danau yang lebih dingin dan padat.
  sumber: usgs-lakes-stratification
- id: sistem-bumi
  istilah: Sistem Bumi
  definisi: Kesatuan atmosfer, hidrosfer, biosfer, kriosfer, dan geosfer yang saling memengaruhi.
  sumber: nasa-earth-system
